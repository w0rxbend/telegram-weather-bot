name: Docker Image CI

on:
  push:
    branches: ["main"]
  workflow_dispatch:  # manual redeploy from the Actions tab (e.g. after rotating TG_BOT_TOKEN)

permissions:
  contents: read

env:
  IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/telegram-weather-bot:latest
  APP_DIR: docker-deployments/apps/bots/telegram/telegram-weather-bot

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Notify me (commit)
        uses: appleboy/telegram-action@390cf7345777cd821dba28c72f436a78bce19cc5 # master
        with:
          to: ${{ secrets.TELEGRAM_NOTIFY_CHAT }}
          token: ${{ secrets.TELEGRAM_NOTIFY_TOKEN }}
          message: |
            #notifications
            🧟 ${{ github.actor }} created commit:
            ✒ Commit message: ${{ github.event.commits[0].message }}
            🗃 Repository: ${{ github.repository }}
            📊 See changes: https://github.com/${{ github.repository }}/commit/${{github.sha}}
      - id: checkout
        name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Login to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      - id: setup-qemu
        name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - id: setup-builder
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image for scanning
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          platforms: linux/amd64
          context: .
          load: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan image (Trivy)
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - id: build
        name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          platforms: linux/amd64,linux/arm64/v8
          context: .
          push: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha
      - name: Notify me (image update)
        uses: appleboy/telegram-action@390cf7345777cd821dba28c72f436a78bce19cc5 # master
        with:
          to: ${{ secrets.TELEGRAM_NOTIFY_CHAT }}
          token: ${{ secrets.TELEGRAM_NOTIFY_TOKEN }}
          message: |
            #notifications
            🐳 New image tag published!

             - Image: ${{ env.IMAGE }}
             - Image digest: ${{ steps.build.outputs.digest }}

            🐋 https://hub.docker.com/r/${{ secrets.DOCKERHUB_USERNAME }}/telegram-weather-bot/tags
      - name: Copy compose file to remote machine
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: docker-compose.yaml
          target: ${{ env.APP_DIR }}
      - id: deploy
        name: Connect to remote machine and deploy
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}  # passed via envs:, never pasted into the script
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script_stop: true
          envs: TG_BOT_TOKEN
          script: |
            export WEATHER_BOT_IMAGE=${{ env.IMAGE }}
            cd $PWD/${{ env.APP_DIR }}
            docker pull $WEATHER_BOT_IMAGE
            docker compose up -d
            docker system prune -f
      - name: Notify me
        uses: appleboy/telegram-action@390cf7345777cd821dba28c72f436a78bce19cc5 # master
        with:
          to: ${{ secrets.TELEGRAM_NOTIFY_CHAT }}
          token: ${{ secrets.TELEGRAM_NOTIFY_TOKEN }}
          message: |
            #notifications
            🚀 Deployed!

            🌤 telegram-weather-bot has been re-deployed with `${{ env.IMAGE }}`

name: Docker Image CI

on:
  push:
    branches: ["main"]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Notify me (commit)
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_NOTIFY_CHAT }}
          token: ${{ secrets.TELEGRAM_NOTIFY_TOKEN }}
          message: |
            #notifications
            🧟 ${{ github.actor }} created commit:
            ✒ Commit message: ${{ github.event.commits[0].message }}
            🗃 Repository: ${{ github.repository }}
            📊 See changes: https://github.com/${{ github.repository }}/commit/${{github.sha}}
      - id: checkout
        name: Checkout
        uses: actions/checkout@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      - id: setup-qemu
        name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - id: setup-builder
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - id: build
        name: Build
        uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64,linux/arm64/v8
          context: .
          push: true
          tags: ${{ secrets.DOKER_IMAGE_TAG }}
      - name: Notify me (image update)
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_NOTIFY_CHAT }}
          token: ${{ secrets.TELEGRAM_NOTIFY_TOKEN }}
          message: |
            #notifications
            🐳 New image tag published!

             - Image ID: ${{ secrets.DOKER_IMAGE_TAG }}
             - Image digest: ${{ steps.build.outputs.digest }}

            🐋 See changes: https://hub.docker.com/r/limpidkzonix/telegram-weather-bot/tags
      - id: deploy
        name: Connect to remote machine and deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script_stop: true
          script: |
            export TG_BOT_TOKEN=${{ secrets.TG_BOT_TOKEN }}
            export WEATHER_BOT_IMAGE=${{ secrets.DOKER_IMAGE_TAG }}
            APP_DIR=$PWD/docker-deployments/apps/bots/telegram/telegram-weather-bot
            mkdir -p $APP_DIR
            cd $APP_DIR
            curl -fsSL -o docker-compose.yaml ${{ secrets.DOCKER_COMPOSE_FILE_URI }}
            docker pull ${{ secrets.DOKER_IMAGE_TAG }}
            docker compose up -d
            docker system prune -f
      - name: Notify me
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_NOTIFY_CHAT }}
          token: ${{ secrets.TELEGRAM_NOTIFY_TOKEN }}
          message: |
            #notifications
            🚀 Deployed!

            🌤 telegram-weather-bot has been re-deployed with the tag `${{ secrets.DOKER_IMAGE_TAG }}`

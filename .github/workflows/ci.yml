name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13", "3.14"]  # pyproject minimum, current, and the Docker image
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Poetry
        run: pipx install "poetry>=2.0,<3"
      - name: Install dependencies
        run: poetry install --no-interaction
      - name: Lint
        run: |
          poetry run ruff check src tests scripts
          poetry run ruff format --check src tests scripts
      - name: Type check
        run: poetry run mypy
      - name: Security lint
        run: poetry run bandit -q -c pyproject.toml -r src
      - name: Dependency audit
        run: |
          pipx inject poetry poetry-plugin-export
          poetry export -f requirements.txt --without-hashes -o requirements.txt
          poetry run pip-audit -r requirements.txt --no-deps --disable-pip
      - name: Test
        run: poetry run pytest -q
      - name: Render a sample card
        run: poetry run python scripts/preview.py --fixture tests/fixtures/forecast.json --out preview.png
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: preview-py${{ matrix.python-version }}
          path: preview.png

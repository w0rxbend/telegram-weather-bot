name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install Poetry
        run: pipx install "poetry>=2.0,<3"
      - name: Install dependencies
        run: poetry install --no-interaction
      - name: Lint
        run: |
          poetry run ruff check src tests scripts
          poetry run ruff format --check src tests scripts
      - name: Type check
        run: poetry run mypy
      - name: Security lint
        run: poetry run bandit -q -c pyproject.toml -r src
      - name: Dependency audit
        run: |
          pipx inject poetry poetry-plugin-export
          poetry export -f requirements.txt --without-hashes -o requirements.txt
          poetry run pip-audit -r requirements.txt --no-deps --disable-pip
      - name: Test
        run: poetry run pytest -q
      - name: Render a sample card
        run: poetry run python scripts/preview.py --fixture tests/fixtures/forecast.json --out preview.png
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: preview
          path: preview.png

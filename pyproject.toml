[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "telegram-weather-bot"
version = "1.0.0"
description = "Telegram bot that turns your shared location into a styled weather infographic"
authors = [{ name = "w0rxbend", email = "balyszyn@gmail.com" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "python-telegram-bot[rate-limiter]>=22.0,<23.0",
    "python-dotenv>=1.0.0,<2.0",
    "httpx>=0.27,<1.0",
    "pillow>=11.0,<14.0",
    "tzdata (>=2024.1)",
]

[project.scripts]
weather-bot = "weather_bot.main:start"

[tool.poetry]
packages = [{ include = "weather_bot", from = "src" }]
include = [{ path = "src/weather_bot/assets/**/*", format = ["sdist", "wheel"] }]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"
pytest-asyncio = ">=0.24"
ruff = ">=0.6"
mypy = ">=1.11"
bandit = ">=1.7"
pip-audit = ">=2.7"
pre-commit = ">=3.8"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "BLE", "ASYNC", "SIM", "RUF", "C4", "PT"]
ignore = ["RUF001", "RUF002", "RUF003", "PT018", "PT011"]  # typographic symbols are intentional

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "ASYNC240"]
"scripts/**" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101"]

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "telegram-weather-bot"
version = "1.0.0"
description = "Telegram bot that turns your shared location into a styled weather infographic"
authors = [{ name = "w0rxbend", email = "balyszyn@gmail.com" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "python-telegram-bot[rate-limiter]>=22.0,<23.0",
    "python-dotenv>=1.0.0,<2.0",
    "httpx>=0.27,<1.0",
    "pillow>=11.0,<14.0",
    "tzdata (>=2024.1)",
]

[project.scripts]
weather-bot = "weather_bot.main:start"

[tool.poetry]
packages = [{ include = "weather_bot", from = "src" }]
include = [{ path = "src/weather_bot/assets/**/*", format = ["sdist", "wheel"] }]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"
pytest-asyncio = ">=0.24"
ruff = ">=0.6"
mypy = ">=1.10"
bandit = ">=1.7"
pip-audit = ">=2.7"
pre-commit = ">=3.7"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC", "BLE", "SIM", "RUF", "C4"]
ignore = [
    "RUF001",  # typographic quotes and emoji in user-facing text are intentional
    "RUF002",
    "RUF003",
    "RUF007",  # zip(a, a[1:]) is clear enough and needs no itertools import
    "RUF046",
    "S101",  # PTB handlers use assert to narrow Optional update fields
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
warn_unused_ignores = true

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = ["B101"]  # asserts only narrow Optional update fields for the type checker

services:
  weather-bot:
    image: ${WEATHER_BOT_IMAGE:-limpidkzonix/telegram-weather-bot:latest}
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    environment:
      - TG_BOT_TOKEN
      - DATA_DIR=/data
    volumes:
      - weather-bot-data:/data

volumes:
  weather-bot-data:

services:
  weather-bot:
    image: ${WEATHER_BOT_IMAGE:-limpidkzonix/telegram-weather-bot:latest}
    restart: unless-stopped
    read_only: true            # only /data (and /tmp) need to be writable
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      - TG_BOT_TOKEN
      - DATA_DIR=/data
    volumes:
      - weather-bot-data:/data

volumes:
  weather-bot-data:
